<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SPECTRA - 8-Panel PV Telemetry Dashboard</title>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #111827; padding: 15px 25px; border-radius: 8px; border: 1px solid #374151; margin-bottom: 20px; }
    .title { font-size: 20px; font-weight: bold; }
    .btn-connect { background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-connect:hover { background: #1d4ed8; }
    .badge { padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; }
    .badge-ok { background: #064e3b; color: #34d399; border: 1px solid #059669; }
    .badge-trip { background: #7f1d1d; color: #f87171; border: 1px solid #dc2626; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .card { background: #1f2937; border-radius: 8px; padding: 16px; border: 1px solid #374151; transition: all 0.2s ease; }
    .card.nominal { border-left: 5px solid #10b981; }
    .card.shading { border-left: 5px solid #f59e0b; background: #262016; }
    .card.fault { border-left: 5px solid #ef4444; background: #29181a; }
    .card-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; }
    .card-val { font-size: 28px; font-weight: bold; margin-bottom: 6px; }
    .status-text { font-size: 13px; font-weight: bold; }
    .status-nominal { color: #10b981; }
    .status-shading { color: #fbbf24; }
    .status-fault { color: #f87171; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="title">⚡ Project SPECTRA: 8-Panel Health Diagnostic Substation</div>
      <div style="font-size: 12px; color: #9ca3af; margin-top: 4px;">Real-Time Multiplexed I2C Telemetry & SSR Fault Isolation</div>
    </div>
    <div style="display: flex; gap: 15px; align-items: center;">
      <span id="ssrBadge" class="badge badge-ok">SSR: GRID TIED (ARMED)</span>
      <button class="btn-connect" onclick="connectSerial()">Connect COM Port</button>
    </div>
  </div>

  <div class="grid" id="panelGrid"></div>

  <script>
    const container = document.getElementById("panelGrid");
    for (let i = 1; i <= 8; i++) {
      container.innerHTML += `
        <div class="card nominal" id="card-${i}">
          <div class="card-title">PV Panel #${i}</div>
          <div class="card-val" id="val-${i}">-- V</div>
          <div class="status-text status-nominal" id="status-${i}">Awaiting Telemetry...</div>
        </div>
      `;
    }

    async function connectSerial() {
      try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        const textDecoder = new TextDecoderStream();
        const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
        const reader = textDecoder.readable.getReader();

        let lineBuffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          lineBuffer += value;
          let lines = lineBuffer.split("\n");
          lineBuffer = lines.pop();

          for (let line of lines) {
            line = line.trim();
            if (line.startsWith("{") && line.endsWith("}")) {
              try {
                const data = JSON.parse(line);
                updateUI(data);
              } catch (e) {}
            }
          }
        }
      } catch (err) {
        alert("Serial Connection Error: " + err);
      }
    }

    function updateUI(data) {
      const ssr = document.getElementById("ssrBadge");
      if (data.trip === 1) {
        ssr.textContent = "🚨 SSR: TRIPPED (ISOLATED)";
        ssr.className = "badge badge-trip";
      } else {
        ssr.textContent = "🟢 SSR: GRID TIED (ARMED)";
        ssr.className = "badge badge-ok";
      }

      if (data.panels) {
        data.panels.forEach(p => {
          const card = document.getElementById(`card-${p.id}`);
          const val = document.getElementById(`val-${p.id}`);
          const st = document.getElementById(`status-${p.id}`);
          if (!card) return;

          val.textContent = `${p.v.toFixed(2)} V`;

          card.classList.remove("nominal", "shading", "fault");
          st.classList.remove("status-nominal", "status-shading", "status-fault");

          if (p.c === 0) {
            card.classList.add("nominal");
            st.classList.add("status-nominal");
            st.textContent = "Nominal MPP";
          } else if (p.c === 1) {
            card.classList.add("shading");
            st.classList.add("status-shading");
            st.textContent = "Partial Shading";
          } else {
            card.classList.add("fault");
            st.classList.add("status-fault");
            st.textContent = "Fault / Disconnected";
          }
        });
      }
    }
  </script>
</body>
</html>
